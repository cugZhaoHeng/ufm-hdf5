# Example Nginx server block for the UFM HDF5 frontend + FastAPI backend.
#
# 1. Start FastAPI first:
#    C:\Users\Administrator\.conda\envs\py310\python.exe -m uvicorn backend.app:app --host 127.0.0.1 --port 8090
#
# 2. Set "root" below to the absolute frontend directory.
# 3. Reload Nginx after changing this file.

server {
    listen 80;
    server_name localhost;

    # HDF5 files are usually large. Increase this as needed.
    client_max_body_size 2048m;

    root D:/git/ufm-hdf5/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large H5 uploads and long animation tasks may take time.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
